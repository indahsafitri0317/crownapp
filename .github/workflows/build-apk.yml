name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Setup Java (Diperlukan untuk Android SDK)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Install Dependencies & Sync Capacitor
      - name: Install Dependencies & Capacitor Sync
        run: |
          npm ci
          npx cap sync android

      # 5. Build APK Debug
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. Upload APK sebagai Artifact (Bisa didownload dari GitHub)
      - name: Upload APK Artifact
        uses: actions/uses-artifact-upload@v4
        with:
          name: crownapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk